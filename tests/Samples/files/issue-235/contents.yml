      – Herrenschnitt, 
      – Reißverschluss bis zum Stehkragen, verdeckte Druckknöpfe, 
      – zwei Brusttaschen mit abgeschrägten Patten und verdeckten Druckknöpfen, 
      – Schriftzug ,Feuerwehrʻ auf der Patte der linken Brusttasche,  
