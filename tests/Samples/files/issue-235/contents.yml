      – Innentaschen links und rechts mit Reißverschluss, 
      – abnehmbare Kapuze, 
      – Wappen werden auf dem linken Oberärmel getragen, mit Ärmelflausch, 
      – Schulterschlaufen links und rechts zur Aufnahme von Überziehschlaufen. “ 
