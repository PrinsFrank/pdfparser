    text: |-
      OpenOffice make sure the document preparations 
      are the same as describe here. Do not use fonts 
      with no serifs like Arial, Helvetica etc. in the text 
      area. Only headlines may be written with Arial 10 
      point bold . The general rule is: DO NOT USE 
      OTHER FONTS. (Papers prepared on other 
      computers on which Arial is not available, use 
      Helvetica (or Geneva) 10 point or a similar 9 point 
      san serif font.) This template is printed in Times 
      New Roman 10 point . Embed all fonts in 
      particular those in the pictures!
      The line spacing should be set at single spacing ‘at 
      least 10 points’. Leave 3 points after each 
      paragraph. Justify the text on both the left and the 
      right margins. 4.2 Heading 3
      To denote further divisions of a subsection, if 
      relevant, use Heading 3. These divisions are not 
      numbered. The style for Heading 3 is Arial 10 point 
      italic justified to the left margin, with 3 point 
      spacing before and after the heading. Begin typing 
      the text in the line beneath the heading. The 
      heading of this section (Heading 3) is an example of 
      the Heading 3 style.
      5 TEXT 
      5.1 Terminology and Symbols
      Authors should use approved terminology and
      symbols, which are relevant for their research
      area. Keep it consistent through the complete
      document .  
       
       
      3.7 Headings and heading spacing
      We recommend using no more than three levels of 
      headings, indicated in these instructions as 
      Heading 1, Heading 2 and Heading 3. The styles for 
      these headings are included in this Word template 
      and are summarised in Table 2 below.
      Avoid long headlines and do not divide headlines 
      into syllables at the ends of lines. 
      Avoid loose Headings to appear at the bottom 
      of a page. 
      4 HEADING 1
      To indicate the major sections of your paper, use 
      Heading  1. These sections should be numbered. 
      For example, Heading 1 is used for the following 
      section headings in these Instructions: 
      INTRODUCTION, TEXT, SUMMARY , etc. 
      The style for Heading 1 is ARIAL 10 POINT BOLD 
      ALL CAPS with a 5 mm (0.2 in) hanging indent to 
      accommodate the number and 3 point spacing 
      after the heading. In addition, leave one carriage 
      return (in Normal style) before the heading. Begin 
      typing the text in the line beneath the heading. 5.2 Style
      The following list summarises several important 
      points of style in order to get a good style in the 
      paper:
      · Use bold or italic for emphasis, but keep its use 
      to a minimum. Avoid using underlining in your 
      paper.
      · Use a consistent spelling style throughout the 
      paper (US or UK English).
      · Use single quotes (‘single quotes’).
      · Use %, not percent (except in figure legends).
      · Do not use ampersands (&) except as part of the 
      official name of an organisation or company.
      · Keep hyphenation to a minimum. Do not 
      hyphenate ‘coordinate’ or ‘non’ words, such as 
      ‘nonlinear’. 
      · Do not end headings with full stops and do not 
      syllabify a heading, let it go on to lines instead. 
      · Do not start a sheadings with no paragraph 
      after at the foot of a column or with only one 
      line of text below. Put the heading on the next 
      column or page.
      · Leave one character space after all 
      punctuation. 4.1 Heading 2
      To denote logical subsections of major sections, if 
      any, use Heading 2. Number the subsections 
      accordingly. In these instructions, for example, the 
      subsections of Section 3 are numbered 3.1, 3.2, 
      3.3, etc. 
      The style for Heading 2 is Arial 10 point bold with 
      a 7.5 mm (0.3 in) hanging indent to accommodate 
      the number and 3 point spacing before and after 
      the heading. Begin typing the text in the line 
      beneath the heading. 5.3 Mathematic text and equations
      Equations should be justified to the left margin 
      and numbered at the right margin. Leave 6 points 
      before and 6 points after the equation, as 
      indicated in the Equation style on the Word 
      template.
      3 2
      x +y =56 (1)
      2 [Conference name, place and date].
