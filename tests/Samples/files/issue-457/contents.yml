    text: |-
      For equation font sizes, use 9 point for full size, 7 
      point for subscript and superscript, and 5 point for 
      sub-subscript and sub-superscript.
      Use italics for variables (u); bold for vectors (no 
      arrows) ( u); bold italic for variable vectors (u) and 
      capital bold italic (U) for variable matrices. Use ith, 
      th th th
      jth, nth, not i , j , n . The order of brackets 
      should be {[()]}, except where brackets have 
      special significance. 6.2 Numbering, captions and positioning
      Number the figures separately from the maps and 
      tables e.g., Figure 1, Figure 2, Figure 3; Table 1, 
      Table 2, Table 3. Map 1, Map 2, Map 3 etc. Use (a), 
      (b), (c) to distinguish individual subjects in a 
      composite figure. See Figures 1 and 2 for examples 
      of figure and caption placement. Refer to Table 2 
      for an example of a table centred across two 
      columns.
      Each figure and each table should have a caption. 
      Captions should be centred at the foot of the 
      figure and typed in the same 10 point font used in 
      the paper. Begin the caption with a capital letter 
      and end with a full stop. Always refer to figures as 
      ‘Figure’ and not Fig. Place the figure or table on the 
      text page as close to the relevant citation as 
      possible, preferably at the top of a column. If a 
      figure or table is too large to fit into one column, it 
      may be centred across both columns at the top or 
      the bottom of the page. Make sure that it does not 
      extend into the page margins. Below are some 
      examples how it may look and where to put the 
      figure and table text above or below the figure.5.4 Lists
      Single space list items with no extra space between 
      the lines. Mark each item with a solid bullet ‘•’ or 
      with an Arabic numeral followed by a full stop, e.g., 
      1. 2. 3. and so on. Be consistent in marking list 
      items.
      Refer to Section 4.1 for an example of a bulleted 
      list. Following is an example of a numbered list:
      1. For complete or near complete sentences begin 
      with a capital letter and end with a full stop.
      2. For short phrases, start with lower case letters 
      and end with semicolons.
      3. Do not capitalise or punctuate single items.
      4. Use a colon to introduce the list.
      6 FIGURES AND TABLES
      6.1 General appearance
      Make sure that all figures, tables, graphs and line 
      drawings are clear and sharp and of the highest 
      quality. Lines should be thick enough to allow 
      proper reproduction. Also in figures: use 
      embedded arial font type only. 
      Diagrams, graphics and photographs should be in 
      gray scale or in colour of excellent quality with 
      good contrast.
      When preparing figures and tables, make sure that 
      all lettering inside the figure is no smaller than the 
      specified size of the paper text, i.e., 10 point. Do 
      not include any headlines in the diagrams, 
      graphics or tables. All headlines should be written 
      separately. See the examples below. Do not use 
      different colours in diagrams. If you use a bar 
      graph, please use a pattern that will appear clearly 
      in black and white. Use different patterns instead 
      of colours, as the colours will not provide sufficient 
      contrast when printed in black and white. 
      If necessary add a source below the diagram. Do 
      not add any kind of background color in the graph. 
      The background should always be white.                      
      (a)                                     (b) 
      Figure 1. Example of picture inserted in the 
      paper.
      Figure 2. Diagram of the system.
      [Conference name, place and date]. 3
