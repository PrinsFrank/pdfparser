      1 INTRODUCTION
      The goal of this template is to achieve uniformity in 
      the papers appearing at www.ep.liu.se. The 
      typography, layout and style used in these 
      instructions are the same you should use when 
      preparing your paper for publishing an article in a 
      journal, conference proceeding etc. The template 
      explains how to prepare an electronic publishing 
      version as well as a camera-ready version. indicated in the title of this example. The first word 
      of the title and all major words must start with a 
      capital. The author section should be in Times, 
      Times Roman or Times New Roman 10 point 
      normal. In general all text in the body must be 
      written with a font with serifs.
      2 IDENTIFYING YOUR PAPER 3.3 Abstract 
      Your abstract should not exceed 100 words. It 
      should provide a brief summary of the contents of 
      your paper. Begin by typing your abstract about 4 
      cm (1.58 in) from the top margin. It should be 
      centred across the page, indented 1,2 cm (0.47 in) 
      from the left and right margins and justified. The 
      word Abstract should be typed in 9 point bold 
      font. The body of the abstract should be in Times, 
      Times Roman, Times New Roman 10 point normal.2.1 Paper title and authors
      The paper title and authors should be exactly in 
      the format as indicated in this template. Authors 
      should be written with the full name (e.g. Peter. 
      Berkesand, not P. Berkesand). Do not use 
      academic titles. (Prof. Dr. etc.). If more than one 
      author make it clear which author belongs to the 
      right affiliation. See example above.
      2.2 Page numbers
      Use page numbers as shown in this template. 3.4 Keywords
      Select 3–5 keywords that can be used to identify
      the subject of your paper. 
      Type the keywords below the abstract, using the
      same format. Leave one carriage return between
      the abstract and the keywords. 
       
       
      3 SETTING UP YOUR PAPER
      3.1 Text area
      The manuscript must fit within the required 
      margins. Do not use fonts without serifs like Arial, 
      Helvetica etc. in the text area. 3.5 Paper body
      Use a two-column format, and set the spacing
      between the columns at 9,5 mm (0.37 in), so that
      column width is 83 mm (3.23 in). 
       
