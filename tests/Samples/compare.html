<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            body {display:flex; align-items: flex-start; gap: 20px;}
            img {margin-top: 32px; width: 634px; height: 898px;}
            object {width: 790px; height: 1000px}
        </style>
    </head>
    <body>
        <img src="out.svg" id="svg">
        <object type="application/pdf" data="./out.pdf#zoom=80&scrollbar=0&navpanes=0">
        </object>
    </body>
    <script>
        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        const svg = document.getElementById('svg');
        svg.addEventListener('mousedown', (event) => {
            isDragging = true;
            startX = event.clientX - currentX;
            event.preventDefault();
        });
        document.addEventListener('mousemove', (event) => {
            if (!isDragging) {return;}
            currentX = Math.max(0, event.clientX - startX);
            svg.style.transform = `translateX(${currentX}px)`;
        });
        document.addEventListener('mouseup', () => {isDragging = false;});
    </script>
</html>
